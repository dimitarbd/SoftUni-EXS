<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp-Form</title>
    <link rel="stylesheet" href="signup-form.css">
</head>

<body>

    <div class="form">
        <ul class="tab-group">
            <li class="tab active"><a href="#">Sign Up</a></li>
            <li class="tab"><a href="#">Log In</a></li>
        </ul>
        <div class="tab-content">
            <div id="signup">
                <h1>Sign Up for Free</h1>

                <form>
                    
                    <div class="top-row">
                        <div class="field-wrap">
                            <label >
                                First Name<span class="req">*</span>
                            </label>
                            <input type="text" />
                        </div>

                        <div class="field-wrap">
                            <label >
                                Last Name<span class="req">*</span>
                            </label>
                            <input type="text" />
                        </div>

                        <div class="field-wrap">
                            <label >
                                Email Address<span class="req">*</span>
                            </label>
                            <input type="text" />
                        </div>

                        <div class="field-wrap">
                            <label >
                                Set A Password<span class="req">*</span>
                            </label>
                            <input type="text" />
                        </div>
                    </div>

                    <button type="submit" class="button button-block"></button>
                </form>

            </div>
        </div>
    </section>
</body>

</html>
