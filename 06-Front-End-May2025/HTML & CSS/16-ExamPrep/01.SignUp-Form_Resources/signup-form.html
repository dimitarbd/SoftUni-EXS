<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp-Form</title>
    <link rel="stylesheet" href="signup-form.css">
</head>

<body>

    <div class="form">
        <ul class="tab-group">
            <li class="tab active"><a href="#">Sign Up</a></li>
            <li class="tab"><a href="#">Log In</a></li>
        </ul>
        <div class="tab-content">
            <div id="signup">
                <h1>Sign Up for Free</h1>

                <form>
                    <input type="text" name="first-name" placeholder="First Name">
                    <input type="text" name="last-name" placeholder="Last Name">
                    <input type="email" name="email-address" placeholder="Email Address">
                    <input type="password" name="password" placeholder="Set A Password">
                    <button type="submit" class="button-last">Get Started</button>
                </form>

            </div>
        </div>
    </section>
</body>

</html>
